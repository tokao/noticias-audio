name: Generar Audio y RSS Diario

on:
  schedule:
    # GitHub programa en UTC y puede retrasarse. Las dos horas cubren el cambio horario;
    # el paso siguiente deja una sola ejecución por fecha local de Ginebra.
    # Se inicia hacia las 05:15 locales para que el episodio esté disponible cerca de las 05:30.
    - cron: '15 3 * * *'
    - cron: '15 4 * * *'
  workflow_dispatch:

concurrency:
  group: daily-audio
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Decidir si corresponde generar
        id: decision
        run: |
          python - <<'PY2'
          from datetime import datetime, time
          from zoneinfo import ZoneInfo
          import json
          import os

          evento = os.environ.get('GITHUB_EVENT_NAME', '')
          debe = True
          motivo = 'ejecución manual'
          ahora = datetime.now(ZoneInfo('Europe/Zurich'))
          fecha = ahora.strftime('%Y-%m-%d')

          if evento == 'schedule':
              dentro = time(5, 15) <= ahora.time() <= time(6, 14)
              existe = False
              try:
                  with open('episodes.json', encoding='utf-8') as f:
                      episodios = json.load(f)
                  existe = any(e.get('guid') == f'boletin-{fecha}' for e in episodios)
              except (OSError, ValueError):
                  existe = False
              debe = dentro and not existe
              motivo = f'Ginebra {ahora:%Y-%m-%d %H:%M:%S %Z}; dentro={dentro}; episodio_existente={existe}'

          print(motivo)
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write(f'debe_generar={str(debe).lower()}\n')
          PY2

      - name: Configurar Python
        if: steps.decision.outputs.debe_generar == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        if: steps.decision.outputs.debe_generar == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade edge-tts

      - name: Generar audio y actualizar RSS
        if: steps.decision.outputs.debe_generar == 'true'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VOICE: es-ES-ElviraNeural
          BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: python generate_audio.py

      - name: Guardar audio y RSS en GitHub
        if: steps.decision.outputs.debe_generar == 'true'
        run: |
          touch .nojekyll
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A episodes rss.xml episodes.json guion_ultimo.txt validacion_ultima.txt .nojekyll
          git commit -m "Episodio diario $(date -u +%F)" || exit 0
          git push
