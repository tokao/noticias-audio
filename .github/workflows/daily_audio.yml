name: Generar Audio y RSS Diario

on:
  schedule:
    # Se ejecuta todos los días a las 06:00 UTC (ajusta la hora si lo prefieres)
    - cron: '0 6 * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente cuando quieras desde la pestaña Actions

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Otorga permisos para guardar los nuevos archivos en el repositorio

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          pip install edge-tts

      - name: Generar audio y actualizar RSS
        run: |
          python generate_audio.py

      - name: Guardar audio y RSS en GitHub
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add *.mp3 rss.xml
          git commit -m "Audio y RSS diarios generados automáticamente" || exit 0
          git push
